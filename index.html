<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineWorld</title>
<style>
body{margin:0;background:#0b0b0b;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#151515;text-align:center}
.logo{font-size:30px;font-weight:bold;color:#e50914}
.search{margin:20px auto;display:block;width:85%;max-width:500px;padding:14px;border:0;border-radius:8px;background:#222;color:white}
h1{text-align:center}
.movies{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:20px}
.card{background:#171717;border-radius:10px;overflow:hidden}
.poster{height:220px;background:#292929;display:flex;align-items:center;justify-content:center;color:#777}
.info{padding:12px}
.info h2{font-size:18px;margin:0 0 8px}
.info p{color:#aaa;margin:0}
@media(min-width:700px){.movies{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<header>
<div class="logo">CineWorld</div>
<p>Movies • Reviews • Trailers</p>
</header>

<input class="search" type="text" placeholder="Search movies...">

<h1>Latest Movies</h1>

<div class="movies">

<div class="card">
<div class="poster">MOVIE POSTER</div>
<div class="info">
<h2>Movie Title</h2>
<p>2026 • Action</p>
</div>
</div>

<div class="card">
<div class="poster">MOVIE POSTER</div>
<div class="info">
<h2>Movie Title</h2>
<p>2026 • Drama</p>
</div>
</div>

<div class="card">
<div class="poster">MOVIE POSTER</div>
<div class="info">
<h2>Movie Title</h2>
<p>2026 • Comedy</p>
</div>
</div>

<div class="card">
<div class="poster">MOVIE POSTER</div>
<div class="info">
<h2>Movie Title</h2>
<p>2026 • Adventure</p>
</div>
</div>

</div>

</body>
</html>
