<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial,sans-serif}
header{padding:25px 15px;background:#151515;text-align:center}
.logo{font-size:34px;font-weight:bold;color:#e50914}
header p{color:#aaa;margin:8px 0 0}
.search{display:block;width:90%;max-width:600px;margin:25px auto;padding:15px;border:1px solid #333;border-radius:10px;background:#1b1b1b;color:white;font-size:16px;outline:none}
h1{text-align:center;margin:30px 0 20px}
.movies{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:15px;max-width:1200px;margin:auto}
.card{background:#171717;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px #000}
.poster{height:250px;background:#292929;display:flex;align-items:center;justify-content:center;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover}
.info{padding:14px}
.info h2{font-size:18px;margin:0 0 8px}
.info p{color:#aaa;margin:5px 0 12px}
.buttons{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:70px;padding:10px;border:0;border-radius:7px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer;color:white;font-size:14px}
.watch{background:#e50914}
.trailer{background:#333}
.review{background:#2a5d8f}
.status{display:inline-block;margin:4px 0 8px;padding:3px 10px;border-radius:5px;font-size:12px;font-weight:bold}
.stars{margin:6px 0;font-size:22px;cursor:pointer;letter-spacing:2px}
.stars span{color:#555}
.stars span.active{color:#ffd700}
.avgRating{font-size:12px;color:#aaa;margin:2px 0 8px}
@media(min-width:700px){.movies{grid-template-columns:repeat(4,1fr)}}
#tm{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:999;padding:12px}

#tm a{color:#fff;margin-top:16px}
#tm button{margin-top:14px;background:#e50914;color:#fff;border:0;padding:10px 24px;border-radius:8px;font-size:16px}
#rm{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
#rm.box{background:#171717;max-width:500px;padding:24px;border-radius:12px;max-height:80vh;overflow-y:auto}
#rm h3{margin-top:0;color:#e50914}
#rm button{margin-top:16px;background:#333;color:#fff;border:0;padding:10px 24px;border-radius:8px}
</style>
</head>

const list = document.getElementById("movieList");
function statusColor(s){ if (s === "Flop") return "#e50914"; if (s === "Coming Soon") return "#555"; return "#2e7d32"; }
function starsHTML(movieId, current){ let h = ""; for (let i = 1; i <= 5; i++){ h += `<span data-id="${movieId}" data-val="${i}" class="${i <= current? 'active' : ''}">★</span>`; } return h; }
async function loadRating(movieId, container){ try { const doc = await db.collection("ratings").doc(movieId).get(); if (doc.exists){ const d = doc.data(); const avg = (d.total / d.count).toFixed(1); container.querySelector(".avgRating").textContent = `${avg} ⭐ - ${d.count} votes`; } else { container.querySelector(".avgRating").textContent = "Abhi koi rating nahi"; } } catch(e){ container.querySelector(".avgRating").textContent = ""; } }
async function submitRating(movieId, val, container){ const ref = db.collection("ratings").doc(movieId); try { await db.runTransaction(async (t) => { const doc = await t.get(ref); if (doc.exists){ const d = doc.data(); t.update(ref, { total: d.total + val, count: d.count + 1 }); } else { t.set(ref, { total: val, count: 1 }); } }); loadRating(movieId, container); container.querySelectorAll(".stars span").forEach(s => { s.classList.toggle("active", parseInt(s.dataset.val) <= val); }); } catch(e){ alert("Rating save nahi hui, dobara try karein."); } }
function render(){ list.innerHTML = ""; movies.forEach((m) => { const card = document.createElement("div"); card.className = "card"; card.innerHTML = `<div class="poster"><img src="${m.poster}" alt="${m.title}"></div><div class="info"><h2>${m.title}</h2><p>${m.year} • ${m.genre}</p><p style="color:#ffd700;font-size:13px">${m.rating || ""}</p><span class="status" style="background:${statusColor(m.status)}">${m.status || ""}</span><p style="font-size:12px">Budget: ${m.budget || "N/A"} | Box Office: ${m.boxOffice || "N/A"}</p><div class="stars">${starsHTML(m.id, 0)}</div><p class="avgRating">Loading...</p><div class="buttons"><a class="btn watch" href="#">Stream</a><a class="btn trailer" href="#">Trailer</a><a class="btn review" href="#">Review</a></div></div>`; card.querySelector(".watch").onclick = (e) => { e.preventDefault(); window.open("https://www.justwatch.com/pk/search?q=" + encodeURIComponent(m.title), "_blank"); }; card.querySelector(".trailer").onclick = (e) => { e.preventDefault(); document.getElementById("tf").src = "https://www.youtube.com/embed/" + m.trailerId + "?autoplay=1"; document.getElementById("tl").href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(m.title + " trailer Hindi"); document.getElementById("tm").style.display = "flex"; }; card.querySelector(".review").onclick = (e) => { e.preventDefault(); document.getElementById("rmTitle").textContent = m.title + " (" + m.year + ")"; document.getElementById("rmText").textContent = m.review; document.getElementById("rm").style.display = "flex"; }; card.querySelectorAll(".stars span").forEach(s => { s.onclick = () => submitRating(m.id, parseInt(s.dataset.val), card); }); list.appendChild(card); loadRating(m.id, card); }); }
function closeTrailer(){ document.getElementById("tm").style.display = "none"; document.getElementById("tf").src = ""; }
function closeReview(){ document.getElementById("rm").style.display = "none"; }
document.getElementById("search").addEventListener("input", function(){ const text = this.value.toLowerCase().trim(); document.querySelectorAll(".card").forEach((card, i) => { card.style.display = movies[i].title.toLowerCase().includes(text)? "" : "none"; }); });
render();
