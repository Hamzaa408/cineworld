.logo{font-size:34px;font-weight:bold;color:#e50914}
header p{color:#aaa;margin:8px 0 0}
.topbar{position:sticky;top:0;z-index:50;background:#151515;border-bottom:1px solid #292929}
.tabs{display:flex;gap:8px;padding:10px 10px 0}
.tabs button{flex:1;background:#222;color:#fff;border:1px solid #333;padding:12px 8px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
.tabs button.active{background:#e50914;border-color:#e50914}
.menu{display:flex;gap:8px;overflow-x:auto;padding:10px;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu button,.menu select{flex-shrink:0;background:#222;color:#fff;border:1px solid #333;padding:9px 16px;border-radius:20px;font-size:14px;font-weight:bold;white-space:nowrap;cursor:pointer;outline:none}
.menu button.active,.menu select.active{background:#e50914;border-color:#e50914}
.empty-msg{grid-column:1/-1;text-align:center;color:#777;padding:40px 10px}
.search{display:block;width:90%;max-width:600px;margin:25px auto;padding:15px;border:1px solid #333;border-radius:10px;background:#1b1b1b;color:#fff;font-size:16px;outline:none}
h1{text-align:center;margin:30px 0 20px}
.movies{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:15px;max-width:1200px;margin:auto}
.card{background:#171717;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px #000;display:flex;flex-direction:column}
.poster{height:250px;background:#292929;display:flex;align-items:center;justify-content:center;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:14px;display:flex;flex-direction:column;flex:1}
.info h2{font-size:18px;margin:0 0 8px}
.info p{color:#aaa;margin:5px 0 12px}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{flex:1;min-width:70px;padding:10px;border:0;border-radius:7px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer;color:#fff;font-size:14px}
.watch{background:#e50914}
.trailer{background:#333}
.review{background:#2a5d8f}
.comments{background:#6a1b9a}
.status{display:inline-block;margin:4px 0 8px;padding:5px 10px;border-radius:5px;font-size:12px;font-weight:bold;align-self:flex-start}
.stars{margin:6px 0;font-size:22px;cursor:pointer;letter-spacing:2px}
.stars span{color:#555}
.stars span.active{color:#ffd700}
.avgRating{font-size:12px;color:#aaa;margin:2px 0 8px}
#tm,#rm,#cm{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:999;padding:12px}
#tm{flex-direction:column}
#tm iframe{width:100%;max-width:700px;aspect-ratio:16/9;border:0;border-radius:12px}
#tm a{color:#fff;margin-top:16px}
#tm button,#rm button{margin-top:14px;background:#e50914;color:#fff;border:0;padding:10px 24px;border-radius:8px;font-size:16px;cursor:pointer}
#rm .box{background:#171717;max-width:500px;width:100%;padding:24px;border-radius:12px;max-height:80vh;overflow-y:auto}
#rm h3{margin-top:0;color:#e50914}
#cm .box{background:#171717;max-width:500px;width:100%;border-radius:12px;padding:16px}
#cmTitle{margin:0 0 10px;color:#e50914;font-size:18px}
#cmMessages{height:280px;overflow-y:auto;background:#0f0f0f;padding:10px;border-radius:8px}
#cm .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#cm input{padding:11px;border:1px solid #333;border-radius:7px;background:#222;color:#fff;outline:none}
#cmName{width:120px}
#cmText{flex:1;min-width:140px}
#cm .send{padding:11px 18px;background:#e50914;color:#fff;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
#cm .send:disabled{opacity:.5}
#cm .close{width:100%;margin-top:10px;padding:10px;background:#333;color:#fff;border:0;border-radius:7px;cursor:pointer}
.chat-section{max-width:700px;margin:45px auto;padding:15px}
.chat-title{text-align:center;margin-bottom:15px}
.chat-title h2{margin:0 0 6px;color:#e50914}
.chat-title p{color:#888;font-size:13px}
.chat-box{background:#151515;border:1px solid #292929;border-radius:12px;overflow:hidden}
.chat-messages{height:320px;overflow-y:auto;padding:15px;background:#0f0f0f}
.chat-message{background:#1c1c1c;border-radius:9px;padding:10px 12px;margin-bottom:10px}
.chat-name{color:#e50914;font-weight:bold;font-size:13px;margin-bottom:4px}
.chat-text{color:#ddd;font-size:14px;line-height:1.4;word-break:break-word}
.chat-time{color:#666;font-size:10px;margin-top:5px}
.chat-form{display:flex;gap:8px;padding:12px;background:#171717;flex-wrap:wrap}
.chat-name-input{width:130px;padding:11px;border:1px solid #333;border-radius:7px;background:#222;color:#fff;outline:none}
.chat-input{flex:1;min-width:150px;padding:11px;border:1px solid #333;border-radius:7px;background:#222;color:#fff;outline:none}
.chat-send{padding:11px 18px;background:#e50914;color:#fff;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
.chat-send:disabled{opacity:.5}
.chat-note{text-align:center;color:#666;font-size:11px;padding:8px}
.no-chat{color:#666;text-align:center;padding:40px 10px}
@media(min-width:700px){.movies{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

<header>
<style>
.logo{
  background:linear-gradient(90deg,#a855f7,#ef4444,#22c55e,#3b82f6,#a855f7);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  animation:logoFlow 6s ease-in-out infinite;
}
@keyframes logoFlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
</style>
  <style>
:root{--bg:#0b0a14;--panel:#15131f;--panel2:#1b1829;--line:#2b2540;--green:#34e0a1;--purple:#a855f7;--text:#fff;--muted:#a9a6bd}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif}
body{display:grid;grid-template-columns:104px minmax(0,1fr);column-gap:10px;align-items:start;padding:0 8px 20px}
body header{grid-column:1/-1;grid-row:1;margin:0 -8px;background:#0f0d1a;padding:22px 12px 18px;border-bottom:3px solid var(--green)}
body header p{color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-size:12px}
body .topbar{grid-column:1;grid-row:2/5;position:sticky;top:10px;z-index:50;margin-top:14px;padding:10px 8px;background:transparent;border:2px solid var(--green);border-radius:20px}
body .search{grid-column:2;grid-row:2;width:100%;max-width:none;margin:14px 0 0;padding:14px 16px;background:var(--panel);border:2px solid var(--line);border-radius:16px;color:var(--text);font-size:15px}
body .search:focus{border-color:var(--green)}
body h1{grid-column:2;grid-row:3;margin:14px 0 10px;padding:16px 14px;text-align:left;font-size:19px;font-weight:900;text-transform:uppercase;border-radius:20px;background:linear-gradient(90deg,#10151c 0%,var(--green) 50%,#10151c 100%);color:#fff}
body .movies{grid-column:2;grid-row:4;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0;max-width:none;margin:0}
body .chat-section{grid-column:1/-1;grid-row:5;width:100%}
body .tabs{display:flex;flex-direction:column;gap:8px;padding:0 0 10px}
body .menu{display:flex;flex-direction:column;gap:8px;padding:0;overflow:visible}
body .tabs button,body .menu button,body .menu select{width:100%;background:var(--panel);color:var(--text);border:2px solid var(--green);border-radius:14px;padding:11px 4px;font-size:12px;font-weight:800;text-align:center;white-space:normal;line-height:1.25}
body .tabs button.active,body .menu button.active,body .menu select.active{background:var(--green);color:#06140e}
body .menu select{appearance:none;-webkit-appearance:none}
body .card{background:linear-gradient(180deg,#1a1626 0%,var(--panel) 100%);border:2px solid rgba(168,85,247,.45);border-radius:18px;box-shadow:none}
body .poster{height:190px;background:#12101c}
body .info{padding:10px}
body .info h2{font-size:14px;line-height:1.25;margin:0 0 6px}
body .info p{color:var(--muted);font-size:12px;margin:4px 0 8px}
body .status{font-size:11px;padding:4px 8px;border-radius:8px}
body .stars{font-size:18px;letter-spacing:1px}
body .buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
body .btn{min-width:0;padding:9px 4px;font-size:12px;border-radius:10px}
body .btn.watch{background:var(--green);color:#06140e}
body .btn.trailer{background:transparent;border:2px solid var(--purple);color:#fff;padding:7px 4px}
body .btn.review{background:#2563eb}
body .btn.comments{background:#7c3aed}
body #tm button,body #rm button,body #cm .send,body .chat-send{background:var(--green);color:#06140e;font-weight:800}

body #rm h3,body #cmTitle,body .chat-title h2,body .chat-name{color:var(--green)}
body .chat-message,body #cm input,body .chat-name-input,body .chat-input{background:var(--panel2);border-color:var(--line);color:var(--text)}

body{grid-template-columns:170px minmax(0,1fr);column-gap:18px;padding:0 18px 30px}
body header{margin:0 -18px}
body .tabs button,body .menu button,body .menu select{font-size:14px;padding:12px 8px}
body .movies{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
body .poster{height:270px}

<style>
@property --green{syntax:'<color>';inherits:true;initial-value:#e8e83a}
:root{animation:colorCycle 12s linear infinite}
@keyframes colorCycle{
0%,10%{--green:#e8e83a}
33%,43%{--green:#34e0a1}
66%,76%{--green:#ff4081}
100%{--green:#e8e83a}
}
body .tabs button.active,body .menu button.active,body .menu select.active{background:var(--green)!important;border-color:var(--green)!important;color:#0b0a14!important}
body .rating-rainbow{background:none!important;-webkit-text-fill-color:var(--green)!important;color:var(--green)!important;animation:none!important}
body h1{color:#fff!important}

<section class="chat-section">

    </form>
    <div class="chat-note">Please respectful language use karein.</div>
  </div>
</section>

<div id="tm">

</div>

<div id="rm">

    <h3 id="rmTitle"></h3>
    <p id="rmText"></p>
    <button onclick="closeReview()">Band karein</button>
  </div>
</div>

<div id="cm">
  <div class="box">
    <h3 id="cmTitle"></h3>
    <div id="cmMessages"></div>
    <form id="cmForm" class="row">
      <input id="cmName" maxlength="30" placeholder="Your name" required>
      <input id="cmText" maxlength="300" placeholder="Is movie ke bare mein likhein..." required>
      <button class="send" id="cmSend" type="submit">Send</button>
    </form>
    <button class="close" onclick="closeComments()">Band karein</button>
  </div>
</div>

  /* ===== AUTO RATING: IMDb + RT (OMDb se) ===== */
(function(){
  const KEY = "c51de151";
  const CACHE = "ratingCache_v1";
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(CACHE) || "{}"); } catch(e) {}

  function clean(t){ return String(t).replace(/\s*\(\d{4}\)\s*$/, "").trim(); }

  // Cache ki ratings pehle laga do
  movies.forEach(function(m){
    if (m.status === "Coming Soon" || m.status === "Most Awaited") return;
    if (String(m.rating || "").indexOf("IMDb") !== -1) return;
    if (cache[m.id] && cache[m.id] !== "none") m.rating = cache[m.id];
  });

  // Jinki rating nahi mili, un ko OMDb se lao
  movies.forEach(function(m){
    if (m.status === "Coming Soon" || m.status === "Most Awaited") return;
    if (String(m.rating || "").indexOf("IMDb") !== -1) return;
    if (cache[m.id]) return;
    const url = "https://www.omdbapi.com/?apikey=" + KEY +
      "&t=" + encodeURIComponent(clean(m.title)) +
      "&y=" + encodeURIComponent(m.year);
    fetch(url).then(function(r){ return r.json(); }).then(function(d){
      if (!d || d.Response === "False" || !d.imdbRating || d.imdbRating === "N/A") {
        cache[m.id] = "none";
      } else {
        let txt = "IMDb " + d.imdbRating;
        const rt = (d.Ratings || []).find(function(x){ return x.Source === "Rotten Tomatoes"; });
        if (rt) txt += " • RT " + rt.Value;
        cache[m.id] = txt;
      }
      try { localStorage.setItem(CACHE, JSON.stringify(cache)); } catch(e) {}
    }).catch(function(){});
  });
})();

/* ========== POSTER SYSTEM ========== */
function placeholderPoster(title){
  return "https://placehold.co/500x750/292929/ffffff?text="+encodeURIComponent(title);
}

function getPosterSources(m){
  const s=[];
  if(m.poster) s.push(m.poster);
  if(m.poster && m.poster.includes("image.tmdb.org/t/p/w500/")){
    const p=m.poster.split("/w500/")[1];
    s.push("https://image.tmdb.org/t/p/w780/"+p);
    s.push("https://image.tmdb.org/t/p/original/"+p);
  }
  const RAWP="raw.githubusercontent.com/Hamzaa408/cineworld/main/";
  const CDNP="cdn.jsdelivr.net/gh/Hamzaa408/cineworld@main/";
  if(m.poster && m.poster.includes(RAWP)) s.push("https://"+CDNP+m.poster.split(RAWP)[1]);
  if(m.poster && m.poster.includes(CDNP)) s.push("https://"+RAWP+m.poster.split(CDNP)[1]);
  return [...new Set(s)];
}

async function getWikiPoster(wiki){
  try{
    const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(wiki));
    if(!r.ok) return null;
    const d=await r.json();
    return (d.thumbnail&&d.thumbnail.source)||(d.originalimage&&d.originalimage.source)||null;
  }catch(e){return null}
}

function loadPoster(img,m){
  const sources=getPosterSources(m);
  let index=0;
  let wikiTried=false;
  async function tryNext(){
    if(index<sources.length){
      img.onerror=tryNext;
      img.src=sources[index++];
      return;
    }
    if(m.wiki && !wikiTried){
      wikiTried=true;
      const url=await getWikiPoster(m.wiki);
      if(url){
        img.onerror=tryNext;
        img.src=url;
        return;
      }
    }
    img.onerror=null;
    img.src=placeholderPoster(m.title);
  }
  tryNext();
}

/* ========== RATINGS ========== */
async function loadRating(movieId,container){
  const el=container.querySelector(".avgRating");
  try{
    const doc=await db.collection("ratings").doc(movieId).get();
    if(doc.exists){
      const d=doc.data();
      const avg=d.count?(d.total/d.count).toFixed(1):"0.0";
      el.textContent=`${avg} ⭐ - ${d.count} votes`;
    }else{
      el.textContent="Abhi koi rating nahi";
    }
  }catch(e){
    el.textContent="Rating unavailable";
  }
}

async function submitRating(movieId,val,container){
  if(getVote(movieId)){
    alert("Aap is movie ko pehle hi rate kar chuke hain. Shukriya!");
    return;
  }
  const ref=db.collection("ratings").doc(movieId);
  try{
    await db.runTransaction(async(t)=>{
      const doc=await t.get(ref);
      if(doc.exists){
        const d=doc.data();
        t.update(ref,{total:(Number(d.total)||0)+val,count:(Number(d.count)||0)+1});
      }else{
        t.set(ref,{total:val,count:1});
      }
    });
    saveVote(movieId,val);
    await loadRating(movieId,container);
    container.querySelectorAll(".stars span").forEach(s=>{
      s.classList.toggle("active",parseInt(s.dataset.val)<=val);
    });
  }catch(e){
    console.error(e);
    alert("Rating save nahi hui, dobara try karein.");
  }
}

const upcomingStatus=["Coming Soon","Most Awaited","Upcoming Blockbuster","Upcoming"];

function getIndustry(m){
  if(m.industry) return m.industry;
  if(tollywoodIds.includes(m.id)) return "tollywood";
  if((m.budget||"").includes("₹")) return "bollywood";
  return "hollywood";
}
function isUpcoming(m){
  return m.upcoming===true || upcomingStatus.includes(m.status);
}

let curType="released", curIndustry="all", curYear="all";
const yearSelect=document.getElementById("yearSelect");

function applyFilters(){
  const text=document.getElementById("search").value.toLowerCase().trim();
  let shown=0;
  document.querySelectorAll(".card").forEach(card=>{
    const m=card._m;
    if(!m) return;
    const ok=
      ((curType==="upcoming")===isUpcoming(m)) &&
      (curIndustry==="all"||getIndustry(m)===curIndustry) &&
      (curType==="upcoming"||curYear==="all"||String(m.year)===curYear) &&
      (!text||m.title.toLowerCase().includes(text)||m.genre.toLowerCase().includes(text)||String(m.year).includes(text));
    card.style.display=ok?"":"none";
    if(ok) shown++;
  });
  let msg=document.getElementById("emptyMsg");
  if(!msg){
    msg=document.createElement("div");
    msg.id="emptyMsg";
    msg.className="empty-msg";
    msg.textContent="Koi movie nahi mili 😕";
    list.appendChild(msg);
  }
  msg.style.display=shown?"none":"block";
  document.querySelector("h1").textContent=curType==="upcoming"?"Upcoming Movies":"Released Movies";
  yearSelect.style.display=curType==="upcoming"?"none":"";
}

let cmUnsub=null,cmMovieId=null;

function openComments(m){
  cmMovieId=m.id;
  document.getElementById("cmTitle").textContent="💬 "+m.title;
  const box=document.getElementById("cmMessages");
  box.innerHTML='<div class="no-chat">Loading...</div>';
  document.getElementById("cm").style.display="flex";
  try{
    document.getElementById("cmName").value=localStorage.getItem("cineworld_chat_name")||"";
  }catch(e){}
  if(cmUnsub) cmUnsub();
  cmUnsub=db.collection("movieChats").doc(m.id).collection("messages")
    .orderBy("createdAt","asc")
    .limitToLast(100)
    .onSnapshot(snap=>{
      box.innerHTML="";
      if(snap.empty){
        box.innerHTML='<div class="no-chat">Abhi koi comment nahi. Pehle aap likhein! 👋</div>';
        return;
      }
      snap.forEach(doc=>{
        const d=doc.data();
        const div=document.createElement("div");
        div.className="chat-message";
        div.innerHTML=`
          <div class="chat-name">${escapeHTML(d.name||"Guest")}</div>
          <div class="chat-text">${escapeHTML(d.text||"")}</div>
          <div class="chat-time">${formatChatTime(d.createdAt)}</div>`;
        box.appendChild(div);
      });
      box.scrollTop=box.scrollHeight;
    },err=>{
      console.error(err);
      box.innerHTML='<div class="no-chat">Comments load nahi ho rahe. Firestore rules check karein.</div>';
    });
}

}

function loadChat(){
  db.collection("chat").orderBy("createdAt","desc").limit(100).onSnapshot(
    snapshot=>{
      chatMessages.innerHTML="";
      if(snapshot.empty){
        chatMessages.innerHTML='<div class="no-chat">Abhi koi message nahi. Sab se pehle aap message karein! 👋</div>';
        return;
      }
      const messages=[];
      snapshot.forEach(doc=>messages.push({id:doc.id,...doc.data()}));
      messages.reverse();
      messages.forEach(m=>{
        const div=document.createElement("div");
        div.className="chat-message";
        div.innerHTML=`
          <div class="chat-name">${escapeHTML(m.name||"Guest")}</div>
          <div class="chat-text">${escapeHTML(m.text||"")}</div>
          <div class="chat-time">${formatChatTime(m.createdAt)}</div>`;
        chatMessages.appendChild(div);
      });
      chatMessages.scrollTop=chatMessages.scrollHeight;
    },
    err=>{
      console.error(err);
      chatMessages.innerHTML='<div class="no-chat">Chat load nahi ho rahi. Firestore rules check karein.</div>';
    }
  );
}

<script>
/* ===== RATING RAINBOW v2 ===== */
(function(){
  var st = document.createElement("style");
  st.textContent =
    "@keyframes ratingFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}" +
    ".rating-rainbow{display:inline-block;font-weight:800;letter-spacing:.6px;" +
    "background:linear-gradient(90deg,#ff0080,#ff8c00,#ffe600,#00e676,#00b0ff,#d500f9,#ff0080)!important;" +
    "background-size:300% 100%!important;" +
    "-webkit-background-clip:text!important;background-clip:text!important;" +
    "-webkit-text-fill-color:transparent!important;color:transparent!important;" +
    "animation:ratingFlow 4s linear infinite}";
  document.head.appendChild(st);

  var re = /^\s*(IMDb|TMDB)\s*\d/;
  var busy = false;
  function paint(){
    busy = false;
    var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    var n;
    while ((n = w.nextNode())) {
      if (re.test(n.nodeValue)) {
        var p = n.parentElement;
        if (p && !p.classList.contains("rating-rainbow") && !p.closest("script,style")) {
          p.classList.add("rating-rainbow");
        }
      }
    }
  }
  function sched(){ if (!busy) { busy = true; requestAnimationFrame(paint); } }
  paint();
  new MutationObserver(sched).observe(document.body, {childList:true, subtree:true, characterData:true});
})();
</script>

<script>
/* ===== TRAILER BUTTON FIX (click par trailer dhoondta hai) ===== */
(function(){
  var TKEY = "96c02451e55812e5a5685360a9b42b23";
  var CK = "trailerCache_v5";
  var cache = {};
  try { cache = JSON.parse(localStorage.getItem(CK) || "{}"); } catch(e) {}
  try {
    var old = JSON.parse(localStorage.getItem("trailerCache_v4") || "{}");
    for (var k in old) { if (old[k] && old[k] !== "none" && !cache[k]) cache[k] = old[k]; }
  } catch(e) {}

  function save(){ try { localStorage.setItem(CK, JSON.stringify(cache)); } catch(e) {} }
  function clean(t){ return String(t).replace(/\s*\(\d{4}\)\s*$/, "").trim(); }
  function j(u){
    return fetch(u).then(function(r){
      if (!r.ok) throw new Error("bad");
      return r.json();
    });
  }
  function canEmbed(key){
    var u = "https://www.youtube.com/oembed?format=json&url=" +
            encodeURIComponent("https://www.youtube.com/watch?v=" + key);
    return fetch(u).then(function(r){
      return !(r.status === 401 || r.status === 403 || r.status === 404);
    }).catch(function(){ return true; });
  }
  function firstOk(keys, i){
    if (i >= keys.length) return Promise.resolve("");
    return canEmbed(keys[i]).then(function(ok){
      return ok ? keys[i] : firstOk(keys, i + 1);
    });
  }

  function lookup(m){
    var base = "https://api.themoviedb.org/3/";
    function search(withYear){
      var q = base + "search/movie?api_key=" + TKEY +
              "&query=" + encodeURIComponent(clean(m.title)) +
              (withYear ? "&year=" + encodeURIComponent(m.year) : "");
      return j(q).then(function(d){ return d.results || []; });
    }
    return search(true).then(function(r){ return r.length ? r : search(false); }).then(function(r){
      if (!r.length) return "";
      var v = base + "movie/" + r[0].id + "/videos?api_key=" + TKEY +
              "&language=en-US&include_video_language=en,hi,te,ta,kn,ml,null";
      return j(v).then(function(x){
        var list = (x.results || []).filter(function(a){ return a.site === "YouTube"; });
        var keys = [];
        [
          list.filter(function(a){ return a.type === "Trailer" && a.official; }),
          list.filter(function(a){ return a.type === "Trailer" && !a.official; }),
          list.filter(function(a){ return a.type === "Teaser"; })
        ].forEach(function(g){ g.forEach(function(a){ keys.push(a.key); }); });
        return firstOk(keys, 0);
      });
    });
  }

  function openModal(id, m){
    var link = document.getElementById("tl");
    link.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(m.title + " trailer Hindi");
    link.textContent = id ? "Hindi trailer YouTube par dekhein" : "Trailer nahi mili, YouTube par dekhein";
    document.getElementById("tf").src = id ? "https://www.youtube.com/embed/" + id + "?autoplay=1" : "";
    document.getElementById("tm").style.display = "flex";
  }

  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest(".btn.trailer");
    if (!a) return;
    var card = a.closest(".card");
    var m = card && card._m;
    if (!m && card) {
      var h = card.querySelector("h2");
      var t = h ? h.textContent.trim() : "";
      m = movies.find(function(x){ return x.title === t; });
    }
    if (!m) return;

    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();

    var id = (m.trailerId && m.trailerId.length === 11) ? m.trailerId : cache[m.id];
    if (id && id !== "none") { openModal(id, m); return; }

    var oldText = a.textContent;
    a.textContent = "Dhoond raha hoon...";
    lookup(m).then(function(key){
      if (key) { m.trailerId = key; cache[m.id] = key; save(); }
      a.textContent = oldText;
      openModal(key || "", m);
    }).catch(function(){
      a.textContent = oldText;
      openModal("", m);
    });
  }, true);
})();
</script>
