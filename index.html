<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}
header{padding:25px 15px;background:#151515;text-align:center}
.logo{font-size:34px;font-weight:bold;color:#e50914}
header p{color:#aaa;margin:8px 0 0}
.search{display:block;width:90%;max-width:600px;margin:25px auto;padding:15px;border:1px solid #333;border-radius:10px;background:#1b1b1b;color:#fff;font-size:16px;outline:none}
h1{text-align:center;margin:30px 0 20px}
.movies{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:15px;max-width:1200px;margin:auto}
.card{background:#171717;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px #000;display:flex;flex-direction:column}
.poster{height:250px;background:#292929;display:flex;align-items:center;justify-content:center;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:14px;display:flex;flex-direction:column;flex:1}
.info h2{font-size:18px;margin:0 0 8px}
.info p{color:#aaa;margin:5px 0 12px}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{flex:1;min-width:70px;padding:10px;border:0;border-radius:7px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer;color:#fff;font-size:14px}
.watch{background:#e50914}
.trailer{background:#333}
.review{background:#2a5d8f}
.comments{background:#6a1b9a}
.status{display:inline-block;margin:4px 0 8px;padding:5px 10px;border-radius:5px;font-size:12px;font-weight:bold;align-self:flex-start}
.stars{margin:6px 0;font-size:22px;cursor:pointer;letter-spacing:2px}
.stars span{color:#555}
.stars span.active{color:#ffd700}
.avgRating{font-size:12px;color:#aaa;margin:2px 0 8px}

#tm,#rm,#cm{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:999;padding:12px}
#tm{flex-direction:column}
#tm iframe{width:100%;max-width:700px;aspect-ratio:16/9;border:0;border-radius:12px}
#tm a{color:#fff;margin-top:16px}
#tm button,#rm button{margin-top:14px;background:#e50914;color:#fff;border:0;padding:10px 24px;border-radius:8px;font-size:16px;cursor:pointer}
#rm .box{background:#171717;max-width:500px;width:100%;padding:24px;border-radius:12px;max-height:80vh;overflow-y:auto}
#rm h3{margin-top:0;color:#e50914}

#cm .box{background:#171717;max-width:500px;width:100%;border-radius:12px;padding:16px}
#cmTitle{margin:0 0 10px;color:#e50914;font-size:18px}
#cmMessages{height:280px;overflow-y:auto;background:#0f0f0f;padding:10px;border-radius:8px}
#cm .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#cm input{padding:11px;border:1px solid #333;border-radius:7px;background:#222;color:#fff;outline:none}
#cmName{width:120px}
#cmText{flex:1;min-width:140px}
#cm .send{padding:11px 18px;background:#e50914;color:#fff;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
#cm .send:disabled{opacity:.5}
#cm .close{width:100%;margin-top:10px;padding:10px;background:#333;color:#fff;border:0;border-radius:7px;cursor:pointer}

.chat-section{max-width:700px;margin:45px auto;padding:15px}
.chat-title{text-align:center;margin-bottom:15px}
.chat-title h2{margin:0 0 6px;color:#e50914}
.chat-title p{color:#888;font-size:13px}
.chat-box{background:#151515;border:1px solid #292929;border-radius:12px;overflow:hidden}
.chat-messages{height:320px;overflow-y:auto;padding:15px;background:#0f0f0f}
.chat-message{background:#1c1c1c;border-radius:9px;padding:10px 12px;margin-bottom:10px}
.chat-name{color:#e50914;font-weight:bold;font-size:13px;margin-bottom:4px}
.chat-text{color:#ddd;font-size:14px;line-height:1.4;word-break:break-word}
.chat-time{color:#666;font-size:10px;margin-top:5px}
.chat-form{display:flex;gap:8px;padding:12px;background:#171717;flex-wrap:wrap}
.chat-name-input{width:130px;padding:11px;border:1px solid #333;border-radius:7px;background:#222;color:#fff;outline:none}
.chat-input{flex:1;min-width:150px;padding:11px;border:1px solid #333;border-radius:7px;background:#222;color:#fff;outline:none}
.chat-send{padding:11px 18px;background:#e50914;color:#fff;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
.chat-send:disabled{opacity:.5}
.chat-note{text-align:center;color:#666;font-size:11px;padding:8px}
.no-chat{color:#666;text-align:center;padding:40px 10px}
@media(min-width:700px){.movies{grid-template-columns:repeat(4,1fr)}}
</style>

<body>

<header>
  <div class="logo">CineWorld</div>
  <p>Movies • Reviews • Trailers</p>
</header>

<input class="search" id="search" type="text" placeholder="Search movies...">
<h1>Latest Movies</h1>
<div class="movies" id="movieList"></div>

<section class="chat-section">
  <div class="chat-title">
    <h2>💬 CineWorld Chat</h2>
    <p>Apni movie opinion aur mashwara yahan share karein</p>
  </div>
  <div class="chat-box">
    <div class="chat-messages" id="chatMessages"><div class="no-chat">Messages load ho rahe hain...</div></div>
    <form class="chat-form" id="chatForm">
      <input class="chat-name-input" id="chatName" type="text" maxlength="30" placeholder="Your name" required>
      <input class="chat-input" id="chatInput" type="text" maxlength="300" placeholder="Apna message likhein..." required>
      <button class="chat-send" id="chatSend" type="submit">Send</button>
    </form>
    <div class="chat-note">Please respectful language use karein.</div>
  </div>
</section>

<div id="tm">
  <iframe id="tf" allowfullscreen allow="autoplay; encrypted-media"></iframe>
  <a id="tl" target="_blank" rel="noopener">Hindi trailer YouTube par dekhein</a>
  <button onclick="closeTrailer()">Band karein</button>
</div>

<div id="rm">
  <div class="box">
    <h3 id="rmTitle"></h3>
    <p id="rmText"></p>
    <button onclick="closeReview()">Band karein</button>
  </div>
</div>

<div id="cm">
  <div class="box">
    <h3 id="cmTitle"></h3>
    <div id="cmMessages"></div>
    <form id="cmForm" class="row">
      <input id="cmName" maxlength="30" placeholder="Your name" required>
      <input id="cmText" maxlength="300" placeholder="Is movie ke bare mein likhein..." required>
      <button class="send" id="cmSend" type="submit">Send</button>
    </form>
    <button class="close" onclick="closeComments()">Band karein</button>
  </div>
</div>

/* ========== HELPERS ========== */
const list=document.getElementById("movieList");

function statusColor(s){
  if(s==="Flop") return "#e50914";
  if(s==="Coming Soon"||s==="Most Awaited") return "#555";
  if(s==="Average") return "#b8860b";
  return "#2e7d32";
}

function starsHTML(id,current){
  let h="";
  for(let i=1;i<=5;i++){
    h+=`<span data-id="${id}" data-val="${i}" class="${i<=current?"active":""}">★</span>`;
  }
  return h;
}

function getVote(id){try{return localStorage.getItem("voted_"+id)}catch(e){return null}}
function saveVote(id,val){try{localStorage.setItem("voted_"+id,val)}catch(e){}}

function escapeHTML(text){
  const d=document.createElement("div");
  d.textContent=text;
  return d.innerHTML;
}

function formatChatTime(ts){
  if(!ts) return "";
  try{return ts.toDate().toLocaleString()}catch(e){return ""}
}

/* ========== POSTER SYSTEM ========== */
function placeholderPoster(title){
  return "https://placehold.co/500x750/292929/ffffff?text="+encodeURIComponent(title);
}

function getPosterSources(m){
  const s=[];
  if(m.poster) s.push(m.poster);

  if(m.poster && m.poster.includes("image.tmdb.org/t/p/w500/")){
    const p=m.poster.split("/w500/")[1];
    s.push("https://image.tmdb.org/t/p/w780/"+p);
    s.push("https://image.tmdb.org/t/p/original/"+p);
  }

  const RAW="raw.githubusercontent.com/Hamzaa408/cineworld/main/";
  const CDN="cdn.jsdelivr.net/gh/Hamzaa408/cineworld@main/";

  if(m.poster && m.poster.includes(RAW)){
    s.push("https://"+CDN+m.poster.split(RAW)[1]);
  }
  if(m.poster && m.poster.includes(CDN)){
    s.push("https://"+RAW+m.poster.split(CDN)[1]);
  }
  return [...new Set(s)];
}

async function getWikiPoster(wiki){
  try{
    const r=await fetch(
      "https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(wiki)
    );
    if(!r.ok) return null;
    const d=await r.json();
    return (d.thumbnail&&d.thumbnail.source)
      || (d.originalimage&&d.originalimage.source)
      || null;
  }catch(e){
    return null;
  }
}

function loadPoster(img,m){
  const sources=getPosterSources(m);
  let index=0;
  let wikiTried=false;

  async function tryNext(){
    if(index<sources.length){
      img.onerror=tryNext;
      img.src=sources[index++];
      return;
    }
    if(m.wiki && !wikiTried){
      wikiTried=true;
      const url=await getWikiPoster(m.wiki);
      if(url){
        img.onerror=tryNext;
        img.src=url;
        return;
      }
    }
    img.onerror=null;
    img.src=placeholderPoster(m.title);
  }

  tryNext();
}

/* ========== RATINGS ========== */
async function loadRating(movieId,container){
  const el=container.querySelector(".avgRating");
  try{
    const doc=await db.collection("ratings").doc(movieId).get();
    if(doc.exists){
      const d=doc.data();
      const avg=d.count?(d.total/d.count).toFixed(1):"0.0";
      el.textContent=`${avg} ⭐ - ${d.count} votes`;
    }else{
      el.textContent="Abhi koi rating nahi";
    }
  }catch(e){
    el.textContent="Rating unavailable";
  }
}

async function submitRating(movieId,val,container){
  if(getVote(movieId)){
    alert("Aap is movie ko pehle hi rate kar chuke hain. Shukriya!");
    return;
  }
  const ref=db.collection("ratings").doc(movieId);
  try{
    await db.runTransaction(async(t)=>{
      const doc=await t.get(ref);
      if(doc.exists){
        const d=doc.data();
        t.update(ref,{
          total:(Number(d.total)||0)+val,
          count:(Number(d.count)||0)+1
        });
      }else{
        t.set(ref,{total:val,count:1});
      }
    });
    saveVote(movieId,val);
    await loadRating(movieId,container);
    container.querySelectorAll(".stars span").forEach(s=>{
      s.classList.toggle("active",parseInt(s.dataset.val)<=val);
    });
  }catch(e){
    console.error(e);
    alert("Rating save nahi hui, dobara try karein.");
  }
}

/* ========== RENDER MOVIES ========== */
function render(){
  list.innerHTML="";

  movies.forEach((m)=>{
    const card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <div class="poster">
        <img src="${placeholderPoster(m.title)}" alt="${escapeHTML(m.title)}" loading="lazy" referrerpolicy="no-referrer">
      </div>
      <div class="info">
        <h2>${m.title}</h2>
        <p>${m.year} • ${m.genre}</p>
        <p style="color:#ffd700;font-size:13px">${m.rating||""}</p>
        <span class="status" style="background:${statusColor(m.status)}">${m.status||""}</span>
        <p style="font-size:12px">Budget: ${m.budget||"N/A"} | Box Office: ${m.boxOffice||"N/A"}</p>
        <div class="stars">${starsHTML(m.id,0)}</div>
        <p class="avgRating">Loading...</p>
        <div class="buttons">
          <a class="btn watch" href="#">Stream</a>
          <a class="btn trailer" href="#">Trailer</a>
          <a class="btn review" href="#">Review</a>
          <a class="btn comments" href="#">Comments</a>
        </div>
      </div>`;

    loadPoster(card.querySelector(".poster img"),m);

    const savedVote=getVote(m.id);
    if(savedVote){
      card.querySelectorAll(".stars span").forEach(s=>{
        s.classList.toggle("active",parseInt(s.dataset.val)<=parseInt(savedVote));
      });
    }

    card.querySelector(".watch").onclick=(e)=>{
      e.preventDefault();
      window.open("https://www.google.com/search?hl=en&q="+encodeURIComponent(m.title+" where to watch"),"_blank");
    };

    card.querySelector(".trailer").onclick=(e)=>{
      e.preventDefault();
      const ytSearch="https://www.youtube.com/results?search_query="+encodeURIComponent(m.title+" trailer Hindi");
      if(!m.trailerId){
        window.open(ytSearch,"_blank");
        return;
      }
      document.getElementById("tf").src="https://www.youtube.com/embed/"+m.trailerId+"?autoplay=1";
      document.getElementById("tl").href=ytSearch;
      document.getElementById("tm").style.display="flex";
    };

    card.querySelector(".review").onclick=(e)=>{
      e.preventDefault();
      document.getElementById("rmTitle").textContent=m.title+" ("+m.year+")";
      document.getElementById("rmText").textContent=m.review||"Review abhi available nahi.";
      document.getElementById("rm").style.display="flex";
    };

    card.querySelector(".comments").onclick=(e)=>{
      e.preventDefault();
      openComments(m);
    };

    card.querySelectorAll(".stars span").forEach(s=>{
      s.onclick=()=>submitRating(m.id,parseInt(s.dataset.val),card);
    });

    list.appendChild(card);
    loadRating(m.id,card);
  });
}

    const m=movies[i];
    const match=
      m.title.toLowerCase().includes(text)||
      m.genre.toLowerCase().includes(text)||
      m.year.toString().includes(text);
    card.style.display=match?"":"none";
  });
});

/* ========== PER-MOVIE COMMENTS ========== */
let cmUnsub=null,cmMovieId=null;

function openComments(m){
  cmMovieId=m.id;
  document.getElementById("cmTitle").textContent="💬 "+m.title;
  const box=document.getElementById("cmMessages");
  box.innerHTML='<div class="no-chat">Loading...</div>';
  document.getElementById("cm").style.display="flex";

  try{
    document.getElementById("cmName").value=localStorage.getItem("cineworld_chat_name")||"";
  }catch(e){}

  if(cmUnsub) cmUnsub();

  cmUnsub=db.collection("movieChats").doc(m.id).collection("messages")
    .orderBy("createdAt","asc")
    .limitToLast(100)
    .onSnapshot(snap=>{
      box.innerHTML="";
      if(snap.empty){
        box.innerHTML='<div class="no-chat">Abhi koi comment nahi. Pehle aap likhein! 👋</div>';
        return;
      }
      snap.forEach(doc=>{
        const d=doc.data();
        const div=document.createElement("div");
        div.className="chat-message";
        div.innerHTML=`
          <div class="chat-name">${escapeHTML(d.name||"Guest")}</div>
          <div class="chat-text">${escapeHTML(d.text||"")}</div>
          <div class="chat-time">${formatChatTime(d.createdAt)}</div>`;
        box.appendChild(div);
      });
      box.scrollTop=box.scrollHeight;
    },err=>{
      console.error(err);
      box.innerHTML='<div class="no-chat">Comments load nahi ho rahe. Firestore rules check karein.</div>';
    });
}

function closeComments(){
  document.getElementById("cm").style.display="none";
  if(cmUnsub){cmUnsub();cmUnsub=null}
  cmMovieId=null;
}

document.getElementById("cmForm").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const name=document.getElementById("cmName").value.trim();
  const textEl=document.getElementById("cmText");
  const text=textEl.value.trim();
  if(!name||!text||!cmMovieId) return;

  const btn=document.getElementById("cmSend");
  btn.disabled=true;
  try{
    await db.collection("movieChats").doc(cmMovieId).collection("messages").add({
      name:name,
      text:text,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    try{localStorage.setItem("cineworld_chat_name",name)}catch(e){}
    textEl.value="";
  }catch(err){
    console.error(err);
    alert("Comment send nahi hua. Firestore rules check karein.");
  }
  btn.disabled=false;
});

/* ========== GENERAL CHAT ========== */
const chatMessages=document.getElementById("chatMessages");
const chatForm=document.getElementById("chatForm");
const chatName=document.getElementById("chatName");
const chatInput=document.getElementById("chatInput");
const chatSend=document.getElementById("chatSend");

try{
  const saved=localStorage.getItem("cineworld_chat_name");
  if(saved) chatName.value=saved;
}catch(e){}

function loadChat(){
  db.collection("chat").orderBy("createdAt","desc").limit(100).onSnapshot(
    snapshot=>{
      chatMessages.innerHTML="";
      if(snapshot.empty){
        chatMessages.innerHTML='<div class="no-chat">Abhi koi message nahi. Sab se pehle aap message karein! 👋</div>';
        return;
      }
      const messages=[];
      snapshot.forEach(doc=>messages.push({id:doc.id,...doc.data()}));
      messages.reverse();
      messages.forEach(message=>{
        const div=document.createElement("div");
        div.className="chat-message";
        div.innerHTML=`
          <div class="chat-name">${escapeHTML(message.name||"Guest")}</div>
          <div class="chat-text">${escapeHTML(message.text||"")}</div>
          <div class="chat-time">${formatChatTime(message.createdAt)}</div>`;
        chatMessages.appendChild(div);
      });
      chatMessages.scrollTop=chatMessages.scrollHeight;
    },
    error=>{
      console.error("Chat error:",error);
      chatMessages.innerHTML='<div class="no-chat">Chat abhi load nahi ho raha. Firebase Firestore check karein.</div>';
    }
  );
}

chatForm.addEventListener("submit",async function(e){
  e.preventDefault();
  const name=chatName.value.trim();
  const text=chatInput.value.trim();
  if(!name||!text) return;
  if(name.length>30){alert("Name bohat lamba hai.");return}
  if(text.length>300){alert("Message bohat lamba hai.");return}

  chatSend.disabled=true;
  chatSend.textContent="Sending...";
  try{
    await db.collection("chat").add({
      name:name,
      text:text,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    try{localStorage.setItem("cineworld_chat_name",name)}catch(e){}
    chatInput.value="";
  }catch(error){
    console.error(error);
    alert("Message send nahi hua. Firebase Firestore check karein.");
  }
  chatSend.disabled=false;
  chatSend.textContent="Send";
});

/* ========== START ========== */
render();
loadChat();
</script>
