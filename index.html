<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineWorld</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0b0b0b;
color:white;
font-family:Arial,sans-serif;
}

header{
padding:25px 15px;
background:#151515;
text-align:center;
}

.logo{
font-size:34px;
font-weight:bold;
color:#e50914;
}

header p{
color:#aaa;
margin:8px 0 0;
}

.search{
display:block;
width:90%;
max-width:600px;
margin:25px auto;
padding:15px;
border:1px solid #333;
border-radius:10px;
background:#1b1b1b;
color:white;
font-size:16px;
outline:none;
}

h1{
text-align:center;
margin:30px 0 20px;
}

.movies{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
max-width:1200px;
margin:auto;
}

.card{
background:#171717;
border-radius:12px;
overflow:hidden;
box-shadow:0 4px 15px #000;
}

.poster{
height:250px;
background:#292929;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.poster img{
width:100%;
height:100%;
object-fit:cover;
}

.info{
padding:14px;
}

.info h2{
font-size:18px;
margin:0 0 8px;
}

.info p{
color:#aaa;
margin:5px 0 12px;
}

.buttons{
display:flex;
gap:8px;
}

.btn{
flex:1;
padding:10px;
border:0;
border-radius:7px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.watch{
background:#e50914;
color:white;
}

.trailer{
background:#333;
color:white;
}

@media(min-width:700px){
.movies{
grid-template-columns:repeat(4,1fr);
}
}
</style>
</head>

<body>

<header>
<div class="logo">CineWorld</div>
<p>Movies • Reviews • Trailers</p>
</header>

<input
class="search"
id="search"
type="text"
placeholder="Search movies..."
onkeyup="searchMovies()"
>

<h1>Latest Movies</h1>

<div class="movies" id="movieList">

<div class="card">
<div class="poster">
<img src="https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg" alt="Movie poster">
</div>
<div class="info">
<h2>Example Movie</h2>
<p>2026 • Action</p>
<div class="buttons">
<a class="btn watch" href="#" onclick="comingSoon()">Watch</a>
<a class="btn trailer" href="#" onclick="comingSoon()">Trailer</a>
</div>
</div>
</div>

<div class="card">
<div class="poster">
<img src="https://image.tmdb.org/t/p/w500/8UlWHLMpgZm9bx6QYh0NFoq67TZ.jpg" alt="Movie poster">
</div>
<div class="info">
<h2>Example Drama</h2>
<p>2026 • Drama</p>
<div class="buttons">
<a class="btn watch" href="#" onclick="comingSoon()">Watch</a>
<a class="btn trailer" href="#" onclick="comingSoon()">Trailer</a>
</div>
</div>
</div>

<div class="card">
<div class="poster">
<img src="https://image.tmdb.org/t/p/w500/qNBAXBIQlnOThrVvA6mA2B5ggV6.jpg" alt="Movie poster">
</div>
<div class="info">
<h2>Example Comedy</h2>
<p>2026 • Comedy</p>
<div class="buttons">
<a class="btn watch" href="#" onclick="comingSoon()">Watch</a>
<a class="btn trailer" href="#" onclick="comingSoon()">Trailer</a>
</div>
</div>
</div>

<div class="card">
<div class="poster">
<img src="https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg" alt="Movie poster">
</div>
<div class="info">
<h2>Example Adventure</h2>
<p>2026 • Adventure</p>
<div class="buttons">
<a class="btn watch" href="#" onclick="comingSoon()">Watch</a>
<a class="btn trailer" href="#" onclick="comingSoon()">Trailer</a>
</div>
</div>
</div>

</div>

<script>
function searchMovies(){
let input=document.getElementById("search").value.toLowerCase();
let cards=document.querySelectorAll(".card");

cards.forEach(card=>{
let title=card.querySelector("h2").innerText.toLowerCase();

if(title.includes(input)){
card.style.display="";
}else{
card.style.display="none";
}
});
}

function comingSoon(){
alert("Movie link will be added soon.");
}
</script>
<script>
const searchBox = document.querySelector("input");
searchBox.addEventListener("input", function () {
  const text = this.value.toLowerCase().trim();
  document.querySelectorAll(".card").forEach(card => {
    const h = card.querySelector("h2, h3");
    const title = h ? h.textContent.toLowerCase() : "";
    card.style.display = title.includes(text) ? "" : "none";
  });
});
</script>
  <script>
const movies = [
  {title:"Deadpool & Wolverine", info:"2024 • Action", q:"Deadpool & Wolverine official trailer"},
  {title:"Wonder Woman 1984", info:"2020 • Action", q:"Wonder Woman 1984 official trailer"},
  {title:"The Super Mario Bros. Movie", info:"2023 • Animation", q:"The Super Mario Bros. Movie official trailer"},
  {title:"Dune: Part Two", info:"2024 • Sci-Fi", q:"Dune Part Two official trailer"}
];

document.querySelectorAll(".card").forEach((card, i) => {
  const m = movies[i];
  if (!m) return;

  const h = card.querySelector("h2, h3");
  if (h) h.textContent = m.title;

  card.querySelectorAll("p, span, div").forEach(el => {
    if (el.children.length === 0 && /^\s*2026/.test(el.textContent)) {
      el.textContent = m.info;
    }
  });

  card.querySelectorAll("button, a").forEach(b => {
    if (b.textContent.trim() === "Trailer") {
      b.removeAttribute("onclick");
      b.removeAttribute("href");
      b.onclick = () => window.open(
        "https://www.youtube.com/results?search_query=" + encodeURIComponent(m.q),
        "_blank"
      );
    }
  });
});
</script>
<style>
#tm{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:999;padding:12px}
#tm iframe{width:100%;max-width:700px;aspect-ratio:16/9;border:0;border-radius:12px}
#tm a{color:#fff;margin-top:16px}
#tm button{margin-top:14px;background:#e50914;color:#fff;border:0;padding:10px 24px;border-radius:8px;font-size:16px}
</style>

<div id="tm">
  <iframe id="tf" allowfullscreen allow="autoplay; encrypted-media"></iframe>
  <a id="tl" target="_blank">YouTube par kholein</a>
  <button onclick="closeT()">Band karein</button>
</div>

<script>
const ids = ["73_1biulkYk","sfM7_JLk-84","TnGl01FkMMo","Way9Dexny3w"];

function closeT(){
  document.getElementById("tm").style.display = "none";
  document.getElementById("tf").src = "";
}

document.querySelectorAll(".card").forEach((card, i) => {
  if (!ids[i]) return;
  const h = card.querySelector("h2, h3");
  const name = h ? h.textContent : "";
  card.querySelectorAll("button, a").forEach(b => {
    if (b.textContent.trim() === "Trailer") {
      b.onclick = () => {
        document.getElementById("tf").src = "https://www.youtube.com/embed/" + ids[i] + "?autoplay=1";
        document.getElementById("tl").href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(name + " official trailer");
        document.getElementById("tm").style.display = "flex";
      };
    }
  });
});
</script>
  <script>
document.querySelectorAll(".card").forEach(card => {
  const h = card.querySelector("h2, h3");
  const name = h ? h.textContent : "";
  card.querySelectorAll("button, a").forEach(b => {
    if (b.textContent.trim() === "Trailer") {
      b.addEventListener("click", () => {
        const l = document.getElementById("tl");
        l.textContent = "Hindi trailer YouTube par dekhein";
        l.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(name + " trailer Hindi");
      });
    }
  });
});
</script>
  <script>
document.querySelectorAll(".card").forEach(card => {
  const h = card.querySelector("h2, h3");

  card.querySelectorAll("button, a").forEach(b => {

</body>
</html>
